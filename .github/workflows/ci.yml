name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Unit tests and full validation
        run: pytest -q
      - name: Validation table, every number in the report, figures
        run: |
          python scripts/validate.py --markdown
          python scripts/summary.py
          python scripts/make_figures.py
      - name: VALIDATION.md is in sync with the code
        if: runner.os == 'Linux'
        run: git diff --exit-code VALIDATION.md
